<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Oberberg Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8B5CF6; --bg: #FBF8F2; --surface: #FFFFFF; --ink: #1E1B14; --ink2: #6B6455; --border: rgba(30,27,20,0.09); --r: 8px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--ink); margin: 0; padding: 20px; line-height: 1.6; }
        .admin-container { max-width: 1400px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .admin-logo { font-family: 'Fraunces', sans-serif; font-weight: 900; font-size: 1.5rem; color: var(--ink); display: flex; align-items: center; gap: 10px; }
        .admin-logo img { height: 40px; width: auto; }
        .admin-nav { display: flex; gap: 15px; }
        .admin-nav a { padding: 10px 20px; background: var(--surface); color: var(--ink2); text-decoration: none; border-radius: var(--r); border: 1px solid var(--border); font-size: 0.9rem; transition: all 0.2s; }
        .admin-nav a:hover, .admin-nav a.active { background: var(--primary); color: white; border-color: var(--primary); }
        .admin-section { display: none; background: var(--surface); border-radius: var(--r); padding: 30px; border: 1px solid var(--border); margin-bottom: 20px; }
        .admin-section.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .section-title { font-family: 'Fraunces', sans-serif; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
        .product-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--ink2); }
        .form-group input, .form-group textarea, .form-group select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r); font-size: 0.9rem; font-family: inherit; background: var(--bg); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .drop-zone { border: 2px dashed var(--border); border-radius: var(--r); padding: 40px; text-align: center; cursor: pointer; background: #F3EFE6; transition: all 0.2s; grid-column: span 2; }
        .drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: rgba(139,92,246,0.12); }
        .drop-zone img { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: var(--r); display: none; }
