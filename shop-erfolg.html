<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellung erfolgreich - 3D Oberberg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #8B5CF6; --bg: #FBF8F2; --surface: #FFFFFF; --ink: #1E1B14; --ink2: #6B6455; --border: rgba(30,27,20,0.09); --r: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-container { background: var(--surface); border-radius: var(--r); padding: 60px 40px; max-width: 600px; width: 90%; text-align: center; border: 1px solid var(--border); }
        .success-icon { width: 100px; height: 100px; background: rgba(139,92,246,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; font-size: 3rem; color: var(--primary); }
        .success-container h1 { font-family: 'Fraunces', sans-serif; font-size: 2rem; font-weight: 900; margin-bottom: 15px; }
        .success-container p { color: var(--ink2); margin-bottom: 30px; font-size: 1.1rem; }
        .order-details { background: var(--bg); border-radius: var(--r); padding: 25px; margin-bottom: 30px; text-align: left; }
        .order-details h3 { font-family: 'Fraunces', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: var(--ink2); font-size: 0.9rem; }
        .detail-value { font-weight: 600; }
        .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--primary); color: white; text-decoration: none; border-radius: var(--r); font-weight: 600; transition: all 0.3s; border: none; cursor: pointer; margin: 10px; }
        .btn:hover { background: #7C3AED; transform: translateY(-2px); }
        .btn-secondary { background: var(--surface); color: var(--primary); border: 2px solid var(--primary); }
        .btn-secondary:hover { background: var(--primary); color: white; }
        .buttons { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h1>Bestellung erfolgreich!</h1>
        <p>Vielen Dank fuer Ihre Bestellung bei 3D Oberberg. Wir haben Ihre Bestaetigung per E-Mail gesendet.</p>
        <div class="order-details">
            <h3>Bestelluebersicht</h3>
            <div class="detail-row"><span class="detail-label">Bestellnummer:</span><span class="detail-value" id="orderId">#XXXXXX</span></div>
            <div class="detail-row"><span class="detail-label">Gesamtbetrag:</span><span class="detail-value" id="orderTotal">0,00 €</span></div>
            <div class="detail-row"><span class="detail-label">Artikel:</span><span class="detail-value" id="itemCount">0 Stueck</span></div>
        </div>
        <div class="buttons">
            <a href="shop.html" class="btn"><i class="fas fa-shopping-bag"></i> Weiter einkaufen</a>
            <a href="#" class="btn btn-secondary" onclick="window.print()"><i class="fas fa-print"></i> Bestaetigung drucken</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id') || 'XXXXXX';
        const total = urlParams.get('total') || '0,00';
        const items = urlParams.get('items') || '0';
        document.getElementById('orderId').textContent = '#' + orderId;
        document.getElementById('orderTotal').textContent = total + ' €';
        document.getElementById('itemCount').textContent = items + ' Stueck';
        localStorage.removeItem('cart');
    </script>
</body>
</html>
