<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestellung erfolgreich | 3D Oberberg</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="3D%20Oberberg_Logo_kl.png">
<style>
  :root{ --bg:#FBF8F2; --ink:#1E1B14; --ink2:#6B6455; --orange:#8B5CF6; --border:rgba(30,27,20,0.09); }
  *{box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column}
  nav{padding:20px 5%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#fff}
  .nav-logo{font-family:'Fraunces',sans-serif;font-weight:900;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
  .content{max-width:560px;margin:auto;padding:80px 5%;text-align:center;flex:1}
  .check{font-size:3rem;margin-bottom:20px}
  h1{font-family:'Fraunces',sans-serif;font-size:2.2rem;margin-bottom:16px}
  p{color:var(--ink2);margin-bottom:32px}
  .btn{display:inline-block;padding:14px 32px;background:var(--orange);color:#fff;border-radius:100px;text-decoration:none;font-weight:600}
  footer{padding:32px 5%;border-top:1px solid var(--border);text-align:center;font-size:0.8rem;color:var(--ink2)}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <img src="3D%20Oberberg_Logo_kl.png" alt="3D Oberberg Logo" style="height:32px;width:auto">
  </a>
</nav>

<div class="content">
  <div class="check">✅</div>
  <h1>Danke für deine Bestellung!</h1>
  <p>Deine Zahlung war erfolgreich. Ich melde mich in Kürze mit einer Bestätigung per E-Mail und kümmere mich um den Druck und Versand.</p>
  <a href="index.html" class="btn">Zurück zur Startseite</a>
</div>

<footer>© 2026 3D Oberberg · Urs Arets</footer>

<script>
  // Nur zur eigenen Übersicht in der Browser-Konsole -- die eigentliche Bestellbestätigung läuft über Stripe.
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  if (sessionId) console.log('Stripe Session:', sessionId);
</script>
</body>
</html>
