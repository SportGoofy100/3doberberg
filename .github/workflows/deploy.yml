name: Deploy to shop.3doberberg.de via FTP

on:
  push:
    branches:
      - shop
  workflow_dispatch:

jobs:
  deploy:
    name: Dateien per FTPS hochladen
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken (volle Historie für Änderungsdatum)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Änderungsdatum der Dateien auf letzten Commit setzen
        run: |
          # lftp überträgt nur Dateien, die neuer sind als die auf dem Server
          git ls-files -z | xargs -0 -n1 -P8 sh -c 'touch -d "@$(git log -1 --format=%ct -- "$0")" "$0"'

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTPS hochladen (nur neue/geänderte Dateien)
        env:
          # Das Zertifikat des Servers gilt nur für a2e0a.netcup.net (gleiche IP wie hosting148663.a2e0a.netcup.net)
          FTP_SERVER: a2e0a.netcup.net
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # config.php (DB-Zugangsdaten) bleibt immer nur auf dem Server
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:timeout 30
          # 1) Dateien mit abweichender Größe (z. B. abgebrochene Uploads) neu übertragen
          mirror -R --ignore-time --parallel=2 --verbose \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            --exclude-glob config.php --exclude-glob admin/config.php \
            --exclude-glob image/cache/ \
            ./ /shop.3doberberg.de/httpdocs/
          # 2) Geänderte Dateien (gleiche Größe, neuerer Stand) übertragen
          mirror -R --only-newer --parallel=2 --verbose \
            --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore \
            --exclude-glob config.php --exclude-glob admin/config.php \
            --exclude-glob image/cache/ \
            ./ /shop.3doberberg.de/httpdocs/
          bye
          LFTP
